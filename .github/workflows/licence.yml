name: License checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Check SPDX headers
        run: |
          chmod +x ./scripts/check-spdx.sh
          ./scripts/check-spdx.sh
