name: License checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  spdx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Check SPDX headers
        run: |
          chmod +x ./scripts/check-spdx.sh
          ./scripts/check-spdx.sh
